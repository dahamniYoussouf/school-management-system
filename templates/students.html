{% extends "base.html" %}

{% block title %}Students - School Management System{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Student Management</h2>
    <button class="btn btn-primary" onclick="showAddModal()">Add New Student</button>
</div>

<div id="studentsList" class="data-table">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Date of Birth</th>
                <th>Grade Level</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentsTableBody">
        </tbody>
    </table>
</div>

<!-- Add/Edit Modal -->
<div id="studentModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle">Add Student</h3>
        <form id="studentForm">
            <input type="hidden" id="studentId">
            <div class="form-group">
                <label>First Name:</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="form-group">
                <label>Last Name:</label>
                <input type="text" id="lastName" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Date of Birth:</label>
                <input type="date" id="dateOfBirth" required>
            </div>
            <div class="form-group">
                <label>Grade Level:</label>
                <input type="text" id="gradeLevel">
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/students.js') }}"></script>
{% endblock %}
