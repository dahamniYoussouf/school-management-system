{% extends "base.html" %}

{% block title %}Teachers - School Management System{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Teacher Management</h2>
    <button class="btn btn-primary" onclick="showAddModal()">Add New Teacher</button>
</div>

<div id="teachersList" class="data-table">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Subject</th>
                <th>Hire Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="teachersTableBody">
        </tbody>
    </table>
</div>

<!-- Add/Edit Modal -->
<div id="teacherModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle">Add Teacher</h3>
        <form id="teacherForm">
            <input type="hidden" id="teacherId">
            <div class="form-group">
                <label>First Name:</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="form-group">
                <label>Last Name:</label>
                <input type="text" id="lastName" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Subject:</label>
                <input type="text" id="subject">
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/teachers.js') }}"></script>
{% endblock %}
